# app.vprodcrm.ru: personal CRM app, proxied to the app container on 127.0.0.1:3000.
# Installed once by hand as /etc/nginx/sites-available/app.vprodcrm.ru; deploys do not touch nginx.
# Change this copy first, then install it and run `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name app.vprodcrm.ru;

    # Let's Encrypt HTTP-01 challenge, needed for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.vprodcrm.ru;
    include snippets/vprodcrm-ssl.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Stream pages with loading states to the browser instead of buffering them whole.
        proxy_buffering off;
    }
}
