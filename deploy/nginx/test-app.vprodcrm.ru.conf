# test-app.vprodcrm.ru: staging of the personal CRM behind a password, proxied to the staging app
# container on 127.0.0.1:3001 (see deploy/environments.sh).
# Installed once by hand as /etc/nginx/sites-available/test-app.vprodcrm.ru; deploys do not touch nginx.
# Change this copy first, then install it and run `sudo nginx -t && sudo systemctl reload nginx`.
# Its own Let's Encrypt certificate (--cert-name test-app.vprodcrm.ru): the shared certificate of
# vprodcrm.ru and app.vprodcrm.ru stays as it is.
server {
    listen 80;
    listen [::]:80;
    server_name test-app.vprodcrm.ru;

    # Let's Encrypt HTTP-01 challenge, needed for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.vprodcrm.ru;

    ssl_certificate     /etc/letsencrypt/live/test-app.vprodcrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.vprodcrm.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:crm_staging_ssl:1m;
    ssl_session_timeout 1d;

    # The whole staging site, /health included, is behind a login and password. The file holds only
    # password hashes; it is made on the server by hand (see README).
    auth_basic           "Personal CRM staging";
    auth_basic_user_file /etc/nginx/test-app.vprodcrm.ru.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The staging password is for nginx only: it never reaches the app.
        proxy_set_header Authorization "";
        # Stream pages with loading states to the browser instead of buffering them whole.
        proxy_buffering off;
    }
}
