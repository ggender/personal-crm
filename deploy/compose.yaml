# The app stack on the server, one file for every environment (prod, staging; see environments.sh).
# Use it only through deploy.sh or compose.sh: they pass the project name (-p prod, -p staging), the
# address and port of the environment, .env (its secrets) and release.env (its current image tag).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app-environment: &app-environment
  DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}@db:5432/crm

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set - run through deploy.sh or compose.sh}
  environment: *app-environment
  depends_on:
    db:
      condition: service_healthy
  # Prod and staging share a small server: no container may take the memory of the others.
  mem_limit: 512m
  logging: *logging

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
    # No ports: the database is reachable only from the containers of this stack.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    mem_limit: 256m
    logging: *logging

  # One-off container: applies migrations and exits. deploy.sh runs it before starting a new image.
  # OWNER_EMAIL: the migration gives the data that already exists to the user with this email.
  migrate:
    <<: *app
    environment:
      <<: *app-environment
      OWNER_EMAIL: ${OWNER_EMAIL:?OWNER_EMAIL is not set in .env}
    command: ["node", "scripts/migrate.ts"]
    mem_limit: 256m
    restart: "no"
    profiles: [migrate]

  # Login: the secret that signs the cookies and the mail server are in .env (secrets); the public
  # address of the environment (login links point to it) and the sender are not secret.
  app:
    <<: *app
    environment:
      <<: *app-environment
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is not set in .env}
      BETTER_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL is not set - run through deploy.sh or compose.sh}
      SMTP_URL: ${SMTP_URL:?SMTP_URL is not set in .env}
      MAIL_FROM: "Личная CRM <noreply@mail.crm.vprodcrm.ru>"
    restart: unless-stopped
    ports:
      # Localhost only: the app is reached from outside through nginx on this server.
      - "127.0.0.1:${APP_PORT:?APP_PORT is not set - run through deploy.sh or compose.sh}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

volumes:
  pgdata:
