# Every push to main: build the app image tagged with the commit SHA, push it to GHCR and deploy it
# to staging (https://test-app.vprodcrm.ru). Prod is never deployed from here: only by hand, with
# deploy-prod.yml, and only a commit whose staging deploy here was green. Deploy logic lives in
# deploy/; this file only calls it.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so pushes reach staging in order; a newer push waits for the running deploy
# instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Its result, kept by GitHub in the deployments of the environment "staging", is what Deploy prod
  # checks: prod gets only a commit whose deploy here was green.
  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deploy of an environment at a time, whichever workflow starts it.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://test-app.vprodcrm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to staging
        run: deploy/ship.sh
        env:
          DEPLOY_ENV: staging
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
