# Every push to main: build the app image tagged with the commit SHA, push it to GHCR, deploy it to
# staging (https://test-app.vprodcrm.ru), then to prod (https://app.vprodcrm.ru). Prod waits for
# staging but goes out whatever staging's result: one after the other, so the two deploys never
# share the server's single CPU. Deploy logic lives in deploy/; this file only calls it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so pushes reach the servers in order; a newer push waits for the running
# deploy instead of cancelling it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deploy of an environment at a time, whichever workflow starts it.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://test-app.vprodcrm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to staging
        run: deploy/ship.sh
        env:
          DEPLOY_ENV: staging
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    needs: [build, deploy-staging]
    # Prod does not depend on staging yet: it goes out even when the staging deploy failed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://app.vprodcrm.ru
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to prod
        run: deploy/ship.sh
        env:
          DEPLOY_ENV: prod
          APP_IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
